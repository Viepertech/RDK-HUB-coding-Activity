name: Python Lint

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: |
          pip install ruff
      - name: Run Ruff Lint
        run: |
          ruff check .
      - name: Check Ruff Formatting
        run: |
          ruff format --check .
